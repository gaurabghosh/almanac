<!DOCTYPE html>
<html lang="en" style="color-scheme: light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Work Journal · GG's Almanac</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="../assets/almanac.css" />
<style>
  .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 28px 20px 96px; }
  .card {
    margin: 64px auto 0; max-width: 520px; padding: 40px 36px; text-align: center; border-radius: 24px;
    border: 1px solid rgba(0,0,0,.06); background: rgba(255,255,255,.7); backdrop-filter: blur(20px);
    box-shadow: 0 1px 2px rgba(16,16,20,.04), 0 10px 34px -12px rgba(16,16,20,.14);
    animation: rise .6s cubic-bezier(.22,1,.36,1) both;
  }
  .emoji { width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; background: linear-gradient(90deg, #d9d8d2, #c9c8c1); }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: 6px 0 18px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  p { margin: 0 auto; max-width: 400px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
  .back { display: inline-block; margin-top: 24px; padding: 9px 16px; border-radius: 12px; text-decoration: none; color: #fff; font-weight: 600; font-size: 13.5px; background: var(--grad); box-shadow: 0 10px 24px -10px rgba(139,92,246,.55); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="mesh">
  <div class="wrap">
    <a class="almanac-crumb" href="../"><span class="dot"></span>GG's Almanac</a>
    <div class="card">
      <div class="emoji">🧭</div>
      <h1>Work Journal</h1>
      <div class="sub">Coming soon</div>
      <p>Decisions, wins, lessons and the arc of each role — captured as they happen, reviewed by quarter. The data source and format are still being decided.</p>
      <a class="back" href="../">Back to the Almanac</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" style="color-scheme: light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>GG's Almanac</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="assets/almanac.css" />
<style>
  .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 56px 20px 96px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .mark {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    background: var(--grad); font-size: 22px; box-shadow: 0 10px 24px -10px rgba(139,92,246,.55);
  }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .tag { margin: 6px 0 0 58px; color: var(--ink-2); font-size: 14.5px; max-width: 560px; line-height: 1.55; }
  .meta { margin: 6px 0 0 58px; color: var(--muted); font-size: 12.5px; }
  .grid {
    margin-top: 40px; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .card {
    position: relative; display: block; text-decoration: none; color: inherit;
    padding: 22px 22px 20px; border-radius: 20px; min-height: 172px;
    border: 1px solid rgba(0,0,0,.06); background: rgba(255,255,255,.7); backdrop-filter: blur(20px);
    box-shadow: 0 1px 2px rgba(16,16,20,.04), 0 10px 34px -12px rgba(16,16,20,.14);
    transition: transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s, border-color .25s;
    animation: rise .6s cubic-bezier(.22,1,.36,1) both;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(16,16,20,.05), 0 22px 44px -14px rgba(16,16,20,.22); border-color: rgba(99,102,241,.25); }
  .card.soon { background: rgba(255,255,255,.42); }
  .card.soon:hover { transform: none; box-shadow: 0 1px 2px rgba(16,16,20,.04), 0 10px 34px -12px rgba(16,16,20,.14); border-color: rgba(0,0,0,.06); cursor: default; }
  .card .top { display: flex; align-items: center; gap: 12px; }
  .card .emoji {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px;
    background: var(--grad); box-shadow: 0 8px 18px -8px rgba(139,92,246,.5);
  }
  .card.soon .emoji { background: linear-gradient(90deg, #d9d8d2, #c9c8c1); box-shadow: none; filter: grayscale(.2); }
  .card h2 { margin: 0; font-size: 16.5px; font-weight: 700; letter-spacing: -.01em; }
  .card .sub { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
  .card p { margin: 14px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
  .card .foot { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px;
    font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
    border: 1px solid rgba(0,0,0,.07); background: rgba(255,255,255,.7);
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: var(--baseline); }
  .badge.live { color: #1c5cab; border-color: rgba(42,120,214,.25); background: rgba(42,120,214,.08); }
  .badge.live::before { background: var(--accent); box-shadow: 0 0 0 3px rgba(42,120,214,.18); }
  .badge.building { color: #9a5b00; border-color: rgba(237,161,0,.3); background: rgba(237,161,0,.1); }
  .badge.building::before { background: #eda100; }
  .card .arrow { transition: transform .2s; }
  .card:not(.soon):hover .arrow { transform: translateX(3px); }
  .lock { font-size: 11.5px; color: var(--muted); }
  footer { margin-top: 56px; border-top: 1px solid rgba(0,0,0,.07); padding-top: 14px; font-size: 12.5px; color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="mesh">
  <div class="wrap">
    <header>
      <div class="mark">📖</div>
      <h1 id="name">GG's Almanac</h1>
    </header>
    <p class="tag" id="tagline"></p>
    <p class="meta" id="meta"></p>
    <section class="grid" id="grid"></section>
    <footer>Every section is encrypted at rest (AES-256-GCM) and unlocked with its own passcode, which never leaves this browser.</footer>
  </div>
  <script type="module">
    import { SECTIONS, ALMANAC } from "./sections.js";
    document.getElementById("name").textContent = ALMANAC.name;
    document.title = ALMANAC.name;
    document.getElementById("tagline").textContent = ALMANAC.tagline;
    const live = SECTIONS.filter((s) => s.status === "live").length;
    document.getElementById("meta").textContent = `${SECTIONS.length} sections · ${live} live`;
    const LABEL = { live: "Live", soon: "Coming soon", building: "In progress" };
    const grid = document.getElementById("grid");
    SECTIONS.forEach((s, i) => {
      const isLive = s.status === "live";
      const el = document.createElement(isLive ? "a" : "div");
      el.className = "card" + (isLive ? "" : " soon");
      if (isLive) el.href = s.href;
      el.style.animationDelay = `${80 + i * 70}ms`;
      el.innerHTML = `
        <div class="top">
          <div class="emoji">${s.emoji}</div>
          <div><h2>${s.title}</h2><div class="sub">${s.subtitle}</div></div>
        </div>
        <p>${s.blurb}</p>
        <div class="foot">
          <span class="badge ${s.status}">${LABEL[s.status] || s.status}</span>
          <span>${isLive ? `<span class="lock">🔒 passcode</span> &nbsp;<span class="arrow">→</span>` : `<span class="lock">${s.source}</span>`}</span>
        </div>`;
      grid.appendChild(el);
    });
  </script>
</body>
</html>
